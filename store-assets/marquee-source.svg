<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="background" x1="40" y1="34" x2="1360" y2="526" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eefaf8"/>
      <stop offset=".54" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#fbf5e9"/>
    </linearGradient>
    <linearGradient id="icon-background" x1="870" y1="116" x2="954" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21304f"/>
      <stop offset="1" stop-color="#11182a"/>
    </linearGradient>
    <linearGradient id="lock-body" x1="887" y1="145" x2="938" y2="199" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65d7c4"/>
      <stop offset="1" stop-color="#36aa98"/>
    </linearGradient>
    <filter id="card-shadow" x="760" y="20" width="650" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#172036" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#background)"/>
  <circle cx="72" cy="42" r="128" fill="#65d7c4" opacity=".1"/>
  <circle cx="1350" cy="526" r="176" fill="#f6c453" opacity=".13"/>
  <circle cx="744" cy="70" r="18" fill="#36aa98" opacity=".16"/>
  <circle cx="778" cy="112" r="7" fill="#f6c453" opacity=".7"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="92" y="126" fill="#217f72" font-size="18" font-weight="800" letter-spacing="4">SKELLOCK</text>
    <text x="92" y="206" fill="#172036" font-size="62" font-weight="800" letter-spacing="-2.7">Un verrou local</text>
    <text x="92" y="274" fill="#172036" font-size="62" font-weight="800" letter-spacing="-2.7">avant Skello.</text>
    <text x="92" y="332" fill="#556078" font-size="22" font-weight="500">Pour limiter les accès non autorisés aux plannings</text>
    <text x="92" y="365" fill="#556078" font-size="22" font-weight="500">sur les ordinateurs partagés.</text>

    <g transform="translate(92 408)">
      <rect width="112" height="38" rx="19" fill="#ffffff" stroke="#dce4eb"/>
      <circle cx="20" cy="19" r="5" fill="#36aa98"/>
      <text x="34" y="25" fill="#39445b" font-size="13" font-weight="800" letter-spacing=".7">LOCAL</text>
    </g>
    <g transform="translate(218 408)">
      <rect width="116" height="38" rx="19" fill="#ffffff" stroke="#dce4eb"/>
      <circle cx="20" cy="19" r="5" fill="#f6c453"/>
      <text x="34" y="25" fill="#39445b" font-size="13" font-weight="800" letter-spacing=".7">CIBLÉ</text>
    </g>
    <g transform="translate(348 408)">
      <rect width="154" height="38" rx="19" fill="#ffffff" stroke="#dce4eb"/>
      <circle cx="20" cy="19" r="5" fill="#36aa98"/>
      <text x="34" y="25" fill="#39445b" font-size="13" font-weight="800" letter-spacing=".7">SANS SUIVI</text>
    </g>

    <text x="92" y="506" fill="#778196" font-size="14" font-weight="500">Extension indépendante, non affiliée à Skello.</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="818" y="66" width="490" height="428" rx="36" fill="#ffffff"/>
  </g>

  <g>
    <rect x="862" y="106" width="92" height="92" rx="24" fill="url(#icon-background)"/>
    <path d="M886 144v-10c0-14 9-25 22-25s22 11 22 25v10" fill="none" stroke="#f6c453" stroke-width="10" stroke-linecap="round"/>
    <rect x="879" y="139" width="58" height="48" rx="14" fill="url(#lock-body)"/>
    <circle cx="908" cy="160" r="7" fill="#172036"/>
    <rect x="905" y="164" width="6" height="12" rx="3" fill="#172036"/>

    <g font-family="Inter, Arial, sans-serif">
      <text x="986" y="128" fill="#217f72" font-size="13" font-weight="800" letter-spacing="2.5">SKELLOCK</text>
      <text x="986" y="166" fill="#172036" font-size="31" font-weight="800" letter-spacing="-1.2">Accès protégé</text>
      <text x="862" y="236" fill="#39445b" font-size="14" font-weight="700">Code d’accès</text>
    </g>

    <rect x="862" y="251" width="402" height="64" rx="14" fill="#ffffff" stroke="#8ecfc4" stroke-width="2"/>
    <rect x="868" y="257" width="390" height="52" rx="10" fill="none" stroke="#36aa98" stroke-opacity=".12" stroke-width="6"/>

    <rect x="862" y="338" width="402" height="58" rx="14" fill="#172036"/>
    <text x="1063" y="375" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle">Continuer</text>

    <line x1="862" y1="423" x2="1264" y2="423" stroke="#e5eaf0"/>
    <circle cx="874" cy="456" r="5" fill="#36aa98"/>
    <text x="890" y="462" fill="#69748a" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500">Autorisation limitée à l’onglet courant</text>
  </g>
</svg>
