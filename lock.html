<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Accès protégé — SiteLock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lock-shell">
      <section class="lock-card" aria-labelledby="page-title">
        <img
          class="brand-icon"
          src="icons/icon-48.png"
          width="48"
          height="48"
          alt=""
        />
        <p class="eyebrow">SiteLock</p>
        <h1 id="page-title">Accès protégé</h1>
        <p class="intro" id="introText">
          Préparation de l’accès sécurisé…
        </p>

        <form id="unlockForm" novalidate aria-busy="true">
          <label for="passwordInput">Code d’accès</label>
          <input
            id="passwordInput"
            name="accessCode"
            type="password"
            autocomplete="off"
            maxlength="128"
            required
            autofocus
            disabled
            aria-describedby="formStatus accessNote"
          />
          <p id="formStatus" class="form-status" role="status" aria-live="polite">
          </p>
          <button id="submitButton" type="submit" disabled>Continuer</button>
        </form>

        <p id="accessNote" class="access-note">
          L’accès reste autorisé dans cet onglet tant que vous restez sur ce
          site. Il est révoqué lorsque vous quittez le site ou fermez l’onglet.
        </p>
      </section>

      <p class="disclaimer">
        SiteLock fonctionne localement sur cet appareil.
      </p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
