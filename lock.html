<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Accès protégé — Skellock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lock-shell">
      <section class="lock-card" aria-labelledby="page-title">
        <img
          class="brand-icon"
          src="icons/icon-48.png"
          width="48"
          height="48"
          alt=""
        />
        <p class="eyebrow">Skellock</p>
        <h1 id="page-title">Accès protégé</h1>
        <p class="intro">
          Saisissez le code d’accès pour continuer vers Skello.
        </p>

        <form id="unlockForm" novalidate>
          <label for="passwordInput">Code d’accès</label>
          <input
            id="passwordInput"
            name="accessCode"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            pattern="[0-9]{4}"
            minlength="4"
            maxlength="4"
            required
            autofocus
            aria-describedby="formStatus accessNote"
          />
          <p id="formStatus" class="form-status" role="status" aria-live="polite">
          </p>
          <button id="submitButton" type="submit">Continuer</button>
        </form>

        <p id="accessNote" class="access-note">
          L’accès est autorisé uniquement dans cet onglet, jusqu’à sa
          fermeture. Cliquez sur l’icône Skellock pour reverrouiller
          immédiatement.
        </p>
      </section>

      <p class="disclaimer">
        Extension indépendante, non affiliée à Skello.
      </p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
